<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: "Courier New", monospace;
            height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .message {
            font-size: 32px;
            line-height: 1.6;
            max-width: 900px;
        }

        .input-section {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        textarea {
            padding: 12px;
            font-size: 16px;
            background-color: #222;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
            font-family: "Courier New", monospace;
            width: 400px;
            max-width: 100%;
            resize: vertical;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Courier New", monospace;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="message">
        <h2>ACCESS DENIED</h2>

        <p>
            This archive contains<br>
            [REDACTED] recovered fragments.
        </p>

        <p>
            Individual access codes required.
        </p>

        <!-- <br><br> -->

        <div id="actionArea"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="puzzle-system.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initUnlocks();
            setupIndex();
        });

        function setupIndex() {
            const actionArea = document.getElementById('actionArea');
            
            if (isPageUnlocked('hollow')) {
                // Show message assembly area if hollow is unlocked
                actionArea.innerHTML = `
                    <div class="input-section" style="margin-top: 20px;">
                        <p style="font-size: 18px; margin-bottom: 10px;">Piece together all your answers in the correct order:</p>
                        <textarea id="finalMessageInput" placeholder="Type all your puzzle answers in the correct order..." style="height: 180px; width: 500px;"></textarea>
                        <button onclick="validateFinalMessage()">Submit Final Message</button>
                    </div>
                    <div id="resultDiv"></div>
                `;
                
                // Restore saved input
                const input = document.getElementById('finalMessageInput');
                if (input) {
                    const saved = localStorage.getItem('finalMessage');
                    if (saved) input.value = saved;
                    
                    input.addEventListener('input', function() {
                        localStorage.setItem('finalMessage', this.value);
                    });
                }
            } else {
                // Show START button
                actionArea.innerHTML = `<button id="startBtn" style="padding: 12px 30px; font-size: 18px; background-color: #333; color: white; border: 1px solid #666; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace;">START</button>`;
                
                const startBtn = document.getElementById('startBtn');
                startBtn.addEventListener('click', function() {
                    unlockPage('hand');
                    navigateToPage('hand');
                });
                startBtn.onmouseover = function() {
                    this.style.backgroundColor = '#555';
                };
                startBtn.onmouseout = function() {
                    this.style.backgroundColor = '#333';
                };
            }
        }

        function validateFinalMessage() {
            const input = document.getElementById('finalMessageInput');
            if (!input) return false;

            const sanitize = (text) => text.toLowerCase().replace(/[.,!?;:\-'"]/g, '').replace(/\s+/g, ' ').trim();
            const userMessage = sanitize(input.value);
            const correctMessage = sanitize(COMPLETE_MESSAGE);

            if (userMessage === correctMessage) {
                showModal('🎉 Congratulations! You have solved the puzzle!');
                const actionArea = document.getElementById('actionArea');
                if (actionArea) {
                    actionArea.innerHTML = `
                        <div style="margin-top:20px;">
                            <p style="color:#aaf;">Sign in to see your rewards below.</p>
                            <div id="resultDiv"><div id="gameKeysDiv"></div></div>
                        </div>
                    `;
                }
                // fetch and display final keys via Firebase-protected endpoint/doc
                displayFinalKeys();
                return true;
            } else {
                showModal('Not quite right. Keep checking your answers and try again!');
                return false;
            }
        }

        function displayFinalKeys() {
            // Delegates to the secure keys display function (requires Firebase setup).
            if (typeof displayGameKeys === 'function') {
                displayGameKeys();
            } else {
                const resultDiv = document.getElementById('resultDiv');
                if (resultDiv) resultDiv.innerHTML = '<p style="color:#ffcc00">Keys are not available — owner must configure Firebase.</p>';
            }
        }
    </script>

</body>

</html>
