<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Entry</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: "Courier New", monospace;
            height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .message {
            font-size: 28px;
            line-height: 1.8;
            max-width: 1000px;
        }

        .input-section {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #222;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
            font-family: "Courier New", monospace;
            width: 300px;
            max-width: 100%;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Courier New", monospace;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    
    <div class="message">

        <h2>B</h2>
        <p>-3</p> 
        <p>jbjlov fjmofkqp x</p>
        </br>
        <p>20 73 6D 69 6C 65 20 6F 6E 20 6D 79 20 66 61 63 65 2E 20 4F 75 72 20 66 72 69 65 6E 64 73 68 69 70 20 62 72 69 6E 67 73</p>

        <div id="inputSection" class="input-section">
            <input type="text" id="answerInput" placeholder="Enter your answer here...">
            <button onclick="validateAnswer('birch')">Submit Answer</button>
        </div>

    </div>

    <script src="puzzle-system.js"></script>

</body>

</html>
